name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck + jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Dry-run orchestrator
        run: ./bench.sh --dry-run --no-prompt --profile quick --label ci --out /tmp/bench-ci
      - name: Render fixture report
        run: |
          python3 report.py tests/fixtures/run-a/
          python3 report.py compare tests/fixtures/run-a/ tests/fixtures/run-b/ --labels "A,B" --out /tmp/compare
          head -40 tests/fixtures/run-a/summary.md
